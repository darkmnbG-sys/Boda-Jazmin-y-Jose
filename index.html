<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex">
    <title>Boda Jazmin & Jose</title>

    <!-- ETIQUETAS PARA VISTA PREVIA EN WHATSAPP -->
    <meta property="og:title" content="Nuestra Boda | Jazmin & Jose">
    <meta property="og:description" content="Tenemos el honor de invitarte a nuestra boda. ¡Acompáñanos en este día tan especial!">
    <meta property="og:image" content="https://darkmnbg-sys.github.io/Boda-Jazmin-y-Jose/fotos/pareja.jpg">
    <meta property="og:url" content="https://darkmnbg-sys.github.io/Boda-Jazmin-y-Jose/">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* PALETA ESTRICTA: Blanco, Beige y Dorado */
        body {
            margin: 0;
            padding: 0;
            background-color: #F9F6F0;
            background-image: radial-gradient(#EAE0D5 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Cormorant Garamond', serif;
            color: #5C4A3D;
        }
        .mobile-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: #FFFFFF;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* ENCABEZADO */
        .top-section {
            background-color: #FFFFFF;
            padding: 50px 20px 30px;
            text-align: center;
            position: relative;
            z-index: 2;
            border-bottom: 3px solid #D4AF37;
        }
        
        /* LOGO EN TEXTO Y FRASE */
        .text-logo {
            font-family: 'Great Vibes', cursive;
            font-size: 5.5em;
            color: #D4AF37;
            margin: 0 auto 5px;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }
        .text-logo span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.6em;
            color: #D4AF37;
            margin: 0 5px;
        }
        .tech-quote {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.35em;
            color: #8B7355;
            line-height: 1.4;
            margin: 0 auto 30px;
            max-width: 95%;
            font-weight: 600;
        }

        .img-pareja {
            width: 100%;
            min-height: 250px;
            display: block;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }

        /* SOBRE BEIGE 3D */
        .css-envelope {
            position: relative;
            width: 92%;
            max-width: 440px;
            height: 180px;
            background-color: #DCD0C0;
            z-index: 1;
            margin: 40px auto 0;
            border-radius: 4px 4px 0 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        .env-bottom {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background-color: #E8DEC8;
            clip-path: polygon(0 100%, 100% 100%, 100% 15%, 50% 75%, 0 15%);
            border-radius: 0 0 4px 4px;
        }
        .env-shadow {
            position: absolute;
            top: 4px; left: 0; width: 100%; height: 85%;
            background-color: rgba(0,0,0,0.1);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 1;
        }
        .env-top {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 85%;
            background-color: #F4EFE6;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 2;
        }

        /* TARJETA BLANCA PRINCIPAL */
        .card-container {
            position: relative;
            width: 84%;
            max-width: 400px;
            margin: -90px auto 0;
            z-index: 3;
        }
        .card {
            background-color: #FFFFFF;
            padding: 60px 15px 50px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            position: relative;
            border: 1px solid #E8DEC8;
            border-radius: 4px;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid #D4AF37;
            pointer-events: none;
            opacity: 0.5;
        }
        
        /* SELLO DE CERA REALISTA 3D */
        .seal {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 85px;
            background: radial-gradient(circle at 35% 35%, #F4E5A1, #D4AF37 50%, #997A15);
            border-radius: 52% 48% 51% 49% / 51% 49% 48% 52%;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2), inset 0 4px 5px rgba(255,255,255,0.6), inset 0 -4px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .seal::before {
            content: '';
            position: absolute;
            width: 64px; 
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #C59B27, #E6C762);
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.4), 0 1px 2px rgba(255,255,255,0.9);
        }
        .seal-content {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #7A5C13;
            position: relative;
            z-index: 1;
            text-shadow: -1px -1px 1px rgba(0,0,0,0.5), 1px 1px 1px rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .seal-content .ampersand-seal {
            font-family: 'Great Vibes', cursive;
            font-size: 1.3em;
            font-weight: normal;
            margin-top: -3px;
        }

        /* TEXTOS Y SEPARADORES */
        .invite-text {
            font-size: 1.1em;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            line-height: 1.5;
            color: #8B7355;
            font-weight: 600;
        }
        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.4em;
            margin: 15px 0;
            font-weight: normal;
            color: #5C4A3D;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
