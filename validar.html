<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Pase</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F9F6F0;
            font-family: 'Cormorant Garamond', serif;
            color: #5C4A3D;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .ticket-box {
            background: #FFFFFF;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 2px solid #D4AF37;
            text-align: center;
            width: 85%;
            max-width: 350px;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8em;
            margin: 0 0 5px;
            color: #D4AF37;
        }
        .subtitle {
            font-size: 1.2em;
            color: #8B7355;
            margin-bottom: 25px;
            font-style: italic;
        }
        .name {
            font-size: 1.6em;
            margin-bottom: 15px;
        }
        .passes {
            font-size: 3em;
            font-weight: bold;
            color: #5C4A3D;
            margin: 15px 0;
            border-top: 1px solid #E8DEC8;
            border-bottom: 1px solid #E8DEC8;
            padding: 15px 0;
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body>

    <div class="ticket-box">
        <div class="icon">✅</div>
        <h1>PASE VÁLIDO</h1>
        <div class="subtitle">Boda Jazmin & Jose</div>
        
        <div style="font-size: 1.1em; color: #888;">Invitado:</div>
        <div class="name" id="nombre">Cargando...</div>
        
        <div style="font-size: 1.1em; color: #888; margin-top: 20px;">Pases autorizados:</div>
        <div class="passes" id="pases">-</div>
    </div>

    <script>
        // Esto extrae los datos ocultos en el enlace del QR
        const params = new URLSearchParams(window.location.search);
        const nombre = params.get('n') || 'No especificado';
        const pases = params.get('p') || '0';
        
        document.getElementById('nombre').innerText = nombre;
        document.getElementById('pases').innerText = pases;
    </script>

</body>
</html>
